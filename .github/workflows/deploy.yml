name: Deploy Worker

# Auto-deploy on push to main. Runs the unit tests first so a red suite blocks
# the deploy rather than shipping past it.
#
# Requires the repo secret CLOUDFLARE_API_TOKEN (same one the weekly workflow
# uses). On top of the R2/D1/KV/AI permissions the helper scripts need, it must
# carry:
#   Account → Workers Scripts → Edit      (upload the script)
#   Zone    → Workers Routes  → Edit      (reconcile the nccn.hsiehting.com
#                                          custom domain; without it the upload
#                                          succeeds but wrangler still exits
#                                          non-zero and the run goes red)

on:
  push:
    branches: [main]
    paths:
      - "cf/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# Never let two deploys race; queue them instead of cancelling, so the last
# push on main is always the one that ends up live.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: cf/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cf
        run: pnpm install --frozen-lockfile

      # wrangler is a global tool here, not a project dependency (cf/package.json
      # only carries vitest) — same as the weekly workflow does it.
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Unit tests
        working-directory: cf
        run: pnpm test

      # deploy.sh stamps the Taipei build time into src/lib/constants.js and
      # then runs `wrangler deploy`. There is no ../.env in CI, so it falls
      # through to CLOUDFLARE_API_TOKEN from the environment. The stamped file
      # is intentionally left uncommitted — committing from CI would loop.
      # Fail loudly on a missing secret. The weekly workflow silently "succeeded"
      # for weeks with an unset CLOUDFLARE_API_TOKEN because its scripts swallow
      # per-file errors and still exit 0 — don't repeat that here.
      - name: Check secret is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::repo secret CLOUDFLARE_API_TOKEN is not set — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set (${#CLOUDFLARE_API_TOKEN} chars)"

      - name: Deploy
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: bash deploy.sh
