name: Update versions & search index

# Cloud, end-to-end version refresh. Runs in GitHub's cloud (no local machine):
# pulls each cached PDF from R2, extracts "Version X.YYYY" with poppler, and
# republishes meta/versions.json to R2 — which the Worker serves onto the cards.
#
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN — a Cloudflare API token
# scoped to Account → Workers R2 Storage → Edit (for this account/bucket).

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (after the daily PDF cron cycles)
  workflow_dispatch: {}

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Extract versions → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: bash gen_versions.sh

      - name: Regenerate first-page thumbnails → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: sudo apt-get install -y webp && bash gen_thumbs.sh

      - name: Build full-text search index → D1
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: bash build_index.sh

      - name: Extract Discussion TOC → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: bash build_toc.sh

      # Banner-free copies for slide-making. Deterministic: strips only the two
      # content streams NCCN stamps on each page, keeps the source /ID, and skips
      # ids whose source PDF hasn't changed (sha256 tracked in meta/clean.json).
      - name: Build banner-free PDFs → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: |
          python3 -m pip install --quiet --upgrade pymupdf
          bash gen_clean.sh

      - name: Show result
        working-directory: cf
        if: always()
        run: |
          tail -3 gen_versions.log || true
          tail -3 gen_clean.log || true
