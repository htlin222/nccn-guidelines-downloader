name: Update versions & search index

# Cloud, end-to-end version refresh. Runs in GitHub's cloud (no local machine):
# pulls each cached PDF from R2, extracts "Version X.YYYY" with poppler, and
# republishes meta/versions.json to R2 — which the Worker serves onto the cards.
#
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN — a Cloudflare API token
# scoped to Account → Workers R2 Storage → Edit (for this account/bucket).

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (after the daily PDF cron cycles)
  workflow_dispatch:
    inputs:
      insights_test_ids:
        description: "gen_insights.sh: space-separated ids to force-process (skips gen_clean.log), for a small manual test"
        required: false
        type: string
      insights_limit:
        description: "gen_insights.sh: LIMIT (max vision pages per id), for a small manual test"
        required: false
        type: string

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install wrangler
        run: npm install -g wrangler

      # Fail on step 1 instead of doing five useless full passes. On 2026-07-27
      # this secret was empty and the run spent eight minutes reading nothing
      # from R2 while four of the five steps still reported success.
      - name: Check the token is set and actually works
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: |
          set -e
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::repo secret CLOUDFLARE_API_TOKEN is empty — nothing downstream can read R2 or D1"
            exit 1
          fi
          # Presence is not enough: a revoked or wrongly-scoped token looks
          # identical until every read quietly returns nothing. Prove both
          # bindings before spending twenty minutes on them.
          wrangler r2 object get nccn-pdfs/meta/versions.json --remote --file=/dev/null \
            || { echo "::error::token cannot read R2 (needs Workers R2 Storage: Edit)"; exit 1; }
          wrangler d1 execute nccn-search --remote --command "SELECT 1" >/dev/null \
            || { echo "::error::token cannot read D1 (needs D1: Edit)"; exit 1; }
          echo "token reaches both R2 and D1"

      # Banner-free copies for slide-making. Deterministic: strips only the two
      # content streams NCCN stamps on each page, keeps the source /ID, and skips
      # ids whose source PDF hasn't changed (sha256 tracked in meta/clean.json).
      #
      # 這一步必須排在所有「衍生資料」之前。它把 raw/<id>.pdf 剝掉橫幅後覆寫根物件
      # <id>.pdf，而下面每一步都是從根物件推導出來的。它以前排在最後，結果是徽章、
      # 縮圖、搜尋索引、TOC、updates 全部比實際發出去的 PDF 慢整整一輪——實測：
      # breast 在 2026-08-03 那輪就已經換成 v6.2026 的 PDF，versions.json 卻要到
      # 8/6 手動補跑才記錄 v5→v6。
      #
      # 剝好的 PDF 同時留一份在 CLEAN_DIR，下游直接讀本機檔。不能讓它們回頭去 R2
      # 重抓：讀取要穿過約 4 小時的快取，剛覆寫完馬上重讀很可能拿回舊 bytes
      # （CLAUDE.md §6），那等於換個方式重現同一個 bug。順帶省掉四輪全目錄下載。
      #
      # continue-on-error 不是放水，紅還是會紅——只是延到最後的 Verify 才算帳。
      # gen_clean.sh 的守門是 `fail -eq 0`：**任何一個** id 失敗就整支非零。它以前
      # 排在最後，紅了無所謂；排到最前面就不一樣了——NCCN cookie 過期時 raw/ 會被
      # 寫進登入頁的 HTML，gen_clean 認出 NOT-PDF 而失敗，若就地中止，整週的徽章、
      # 縮圖、索引、TOC、updates 全部一起停擺。失敗的 id 不會進 CLEAN_DIR，下游對
      # 它們自動退回讀 R2，也就是它們原本的行為，資料仍跟線上服務的那份一致。
      - name: Build banner-free PDFs → R2
        id: clean
        continue-on-error: true
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
        run: |
          python3 -m pip install --quiet --upgrade pymupdf
          bash gen_clean.sh

      - name: Extract versions → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
        run: bash gen_versions.sh

      - name: Regenerate first-page thumbnails → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
        run: sudo apt-get install -y webp && bash gen_thumbs.sh

      - name: Build full-text search index → D1
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
        run: bash build_index.sh

      # AI 逐頁重點的批次讀圖（issue #9）：讀圖只做一次（Gemini），存進 page_raw；
      # 四種格式一次 Groq 呼叫從 raw 轉出。只處理這一輪 gen_clean.sh 真的標記
      # OK（sha 變了）的 id——見 gen_insights.sh 開頭的註解與 issue #9 的額度試算。
      # 額度用完是正常結束（exit 0），不是失敗，所以這步不擋後面任何一步。
      - name: "AI page insights: read once, format via Groq → D1"
        working-directory: cf
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANGED_IDS: ${{ github.event.inputs.insights_test_ids }}
          LIMIT: ${{ github.event.inputs.insights_limit }}
        run: bash gen_insights.sh

      - name: Extract Discussion TOC → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
        run: bash build_toc.sh

      # 每一版改了什麼，逐條拆好存成 meta/updates/<id>.json。/api/v1/updates 直接
      # 端這個檔出去，Claude Code skill 不必自己去翻 PDF 前幾頁猜章節邊界。
      - name: Extract "Summary of the Guidelines Updates" → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          CLEAN_DIR: ${{ runner.temp }}/clean
        run: bash build_updates.sh

      # Every step above can pass on its own terms and still leave the site
      # wrong, so check the things a reader actually sees: a populated index, a
      # versions manifest covering the whole catalogue, and clean copies for it.
      - name: Verify the result
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: |
          set -e
          # gen_clean 的失敗延到這裡才算帳（見那一步的註解）。
          [ "${{ steps.clean.outcome }}" = "success" ] \
            || { echo "::error::gen_clean.sh 有失敗的 id — 見上面的 log；那些 id 這一輪仍是舊的乾淨檔"; exit 1; }
          # 兩個分母，因為兩個產物涵蓋的範圍本來就不同：
          #   versions.json 兩邊都有（索引、縮圖、版本都跨來源）
          #   clean.json    只有 NCCN——MDA 的 PDF 沒有 banner 要剝，gen_clean.sh
          #                 根本不會走到它們（見 lib/pdf.js 的 refreshKey）
          # 用聯集去驗 clean.json 會讓這一步在完全正常的情況下永遠紅。
          nccn=$(python3 -c "import json;print(len(json.load(open('guidelines.json'))))")
          total=$(python3 -c "import json;print(sum(len(json.load(open(f))) for f in ('guidelines.json','algorithms.json')))")
          rows=$(wrangler d1 execute nccn-search --remote --json \
            --command "SELECT COUNT(*) AS n FROM pages" 2>/dev/null \
            | tr -d ' \n' | sed -n 's/.*"n":\([0-9]*\).*/\1/p')
          echo "search index rows: ${rows:-0} (catalogue: $total guidelines)"
          echo "INDEX_ROWS=${rows:-0}" >> "$GITHUB_ENV"
          [ "${rows:-0}" -ge 1000 ] || { echo "::error::search index has ${rows:-0} rows — it is broken"; exit 1; }
          # page_text feeds /api/v1/page and is written from the same loop as
          # pages. If the two ever disagree, search and the API are looking at
          # different versions of the same guideline.
          prows=$(wrangler d1 execute nccn-search --remote --json \
            --command "SELECT COUNT(*) AS n FROM page_text" 2>/dev/null \
            | tr -d ' \n' | sed -n 's/.*"n":\([0-9]*\).*/\1/p')
          echo "page_text rows: ${prows:-0}"
          [ "${prows:-0}" -eq "${rows:-0}" ] \
            || { echo "::error::page_text has ${prows:-0} rows but pages has ${rows:-0} — the API and search disagree"; exit 1; }
          check_manifest() {
            f="$1"; denom="$2"
            wrangler r2 object get "nccn-pdfs/$f" --remote --file="/tmp/$(basename "$f")" \
              || { echo "::error::$f missing from R2"; exit 1; }
            n=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "/tmp/$(basename "$f")")
            echo "$f: $n entries (of $denom)"
            [ "$n" -ge $((denom / 2)) ] || { echo "::error::$f only covers $n/$denom guidelines"; exit 1; }
            # 上界也要看。manifest 比目錄還長，意思是裡面有目錄裡沒有的 id——
            # 2026-08-27 那輪 clean.json 是 93/91，多的正是 NCCN 已經拆掉的兩份，
            # 因為 gen_clean 的 manifest 當時只 upsert 不修剪。下界檢查看不到這種事。
            [ "$n" -le "$denom" ] \
              || { echo "::error::$f has $n entries but the catalogue only has $denom — it is carrying ids that no longer exist"; exit 1; }
          }
          check_manifest meta/versions.json "$total"
          check_manifest meta/clean.json "$nccn"

      # /api/v1 的 KV 快取全部帶著這個世代號當 key 前綴，所以改寫它一次就等於整批
      # 失效（KV 沒有「刪掉某個前綴」，逐鍵刪又慢又貴；孤兒項目靠 30 天 TTL 自己
      # 消失）。一定要在 Verify 之後——先清快取再發現重建是壞的，等於拿舊快取換了
      # 一份壞資料。run_id 單調遞增，天然適合當世代號。
      - name: Bump the API cache generation
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: |
          wrangler kv key put api:gen "${{ github.run_id }}" --binding NCCN_KV --remote \
            || { echo "::error::could not bump api:gen — /api/v1 will keep serving the previous build for up to 30 days"; exit 1; }
          echo "api cache generation → ${{ github.run_id }}"

      # 通知中心的歷史卸載。放在驗證之後，因為它會刪 D1 的列——上面任何一步炸掉時
      # 這一輪的重點是「哪裡壞了」，不是整理舊資料。
      - name: Archive old notifications → R2
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
        run: KEEP_DAYS=90 bash archive_notify.sh

      # 這一輪的結果自己寫一則進通知中心。always() 是重點：跑綠了要留紀錄，跑紅了
      # 更要——否則週更默默壞掉，首頁上完全看不出來。
      - name: Notify the result
        working-directory: cf
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3a77813251d473c40d8873a59f6c0e80"
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rows="${INDEX_ROWS:-0}"
          if [ "$STATUS" = "success" ]; then
            bash notify.sh ci info "每週重建完成（索引 $rows 筆）" \
              "{\"rows\":$rows,\"url\":\"$RUN_URL\"}"
          else
            bash notify.sh ci error "每週重建失敗（$STATUS）" \
              "{\"errors\":[\"見 GitHub Actions 記錄\"],\"url\":\"$RUN_URL\"}"
          fi

      - name: Show result
        working-directory: cf
        if: always()
        run: |
          tail -3 gen_versions.log || true
          tail -5 build_index.log || true
          tail -3 gen_clean.log || true
          tail -5 gen_insights.log || true
